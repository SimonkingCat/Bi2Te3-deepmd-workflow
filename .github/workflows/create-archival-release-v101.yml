name: Create archival release v1.0.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: 41edc93c4ce04c1e3901d1c3c3aea77d71d4f7bb
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.1 already exists."
            exit 0
          fi
          gh release create v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "v1.0.1" \
            --notes "Archival release of the Bi2Te3 Deep Potential workflow package for the Nature Communications code-availability requirement. This release points to commit 41edc93c4ce04c1e3901d1c3c3aea77d71d4f7bb, which contains README, CITATION.cff, and .zenodo.json metadata for Zenodo archiving after Zenodo-GitHub integration was enabled."
